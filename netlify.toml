# Netlify deploy config for this Turborepo.
#
# The Next.js Runtime (@netlify/plugin-nextjs) auto-installs when Netlify
# detects a Next.js app — you don't need to add it to package.json yourself.
# This file's job is just telling Netlify WHERE the Next.js app lives
# (apps/web, not the repo root) and making sure the Prisma client is
# generated before `next build` runs (Next.js needs it at build time for
# type-checking server components/route handlers that import it).

[build]
  base = "apps/web"
  command = "npx prisma generate --schema=../../packages/db/prisma/schema.prisma && npm run build"
  publish = ".next"

[build.environment]
  # Turborepo + npm workspaces need a newer Node than Netlify's older
  # default. 22, not 20: `ai@7` and one of Inngest's dependencies
  # (kysely) both require Node >=22 — a plain "LTS-sounding" version
  # isn't enough, this is a real floor from the dependency tree.
  NODE_VERSION = "22"

# Server-only secrets (DATABASE_URL, BETTER_AUTH_SECRET, ENCRYPTION_KEY,
# GITHUB_APP_*, INNGEST_*, RAZORPAY_*, RESEND_API_KEY) are NOT set here —
# add them in Netlify's dashboard under Site settings -> Environment
# variables, not in this file, since this file is committed to git.


