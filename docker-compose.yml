services:
  postgres:
    image: postgres:16-alpine
    container_name: shipflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipflow
      POSTGRES_PASSWORD: shipflow
      POSTGRES_DB: shipflow
    ports:
      - "5432:5432"
    volumes:
      - shipflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipflow_pgdata:


